        <main class="main_content"> <!-- Image Map Generated by http://www.image-map.net/ -->
            <img class="map" src="image/ban-do-vi-tri-viet-nam.jpg"
                usemap="#image-map">

            <map name="image-map">
                <area target="_blank" alt="Đồng Tháp" title="Đồng Tháp"
                    href="https://dongthap.gov.vn/" coords="2129,8062,2407,8359"
                    shape="rect">
                <area target="_blank" alt="Cà Mau" title="Cà Mau"
                    href="https://www.camau.gov.vn/"
                    coords="1783,9089,2043,9373"
                    shape="rect">
                <area target="_blank" alt="Kiên Giang" title="Kiên Giang"
                    href="https://vi.wikipedia.org/wiki/Ki%C3%AAn_Giang"
                    coords="1886,8497,2152,8769" shape="rect">
                <area target="_blank" alt="Bạc Liêu" title="Bạc Liêu"
                    href="https://vi.wikipedia.org/wiki/B%E1%BA%A1c_Li%C3%AAu_(t%E1%BB%89nh)"
                    coords="2000,8868,2326,9053" shape="rect">
            </map>

            <!--PROMPT ĐỂ TEST IMAGE MAP-->
            <script>
            // 1. Chờ cho giao diện tải xong
            document.addEventListener("DOMContentLoaded", function() {
                
                // 2. Lấy thẻ ảnh và danh sách các vùng click (area)
                const img = document.querySelector('.map');
                const areas = document.querySelectorAll('map[name="image-map"] area');

                // Hàm thực hiện tính toán lại tọa độ
                function resizeImageMap() {
                    // Lấy kích thước GỐC của bức ảnh (khi chưa dùng CSS)
                    const originalWidth = img.naturalWidth;
                    const originalHeight = img.naturalHeight;

                    // Lấy kích thước HIỆN TẠI trên web (sau khi bị CSS ép về 800px)
                    const currentWidth = img.clientWidth;
                    const currentHeight = img.clientHeight;

                    // Tính tỷ lệ thu nhỏ cho trục X và trục Y
                    const scaleX = currentWidth / originalWidth;
                    const scaleY = currentHeight / originalHeight;

                    // Duyệt qua từng thẻ <area> để sửa lại tọa độ
                    areas.forEach(function(area) {
                        // Lưu lại tọa độ gốc vào 1 thuộc tính tạm (data-original-coords) 
                        // để không bị mất số gốc nếu cửa sổ web thay đổi kích thước
                        if (!area.dataset.originalCoords) {
                            area.dataset.originalCoords = area.getAttribute('coords');
                        }

                        // Lấy chuỗi tọa độ gốc và cắt thành một mảng các con số
                        // Ví dụ: "2129,8062,2407,8359" -> [2129, 8062, 2407, 8359]
                        const originalCoords = area.dataset.originalCoords.split(',');
                        
                        // Tính toán mảng tọa độ mới
                        const newCoords = originalCoords.map(function(coord, index) {
                            // index chẵn (0, 2, 4...) là tọa độ X -> nhân với scaleX
                            // index lẻ (1, 3, 5...) là tọa độ Y -> nhân với scaleY
                            if (index % 2 === 0) {
                                return Math.round(coord * scaleX);
                            } else {
                                return Math.round(coord * scaleY);
                            }
                        });

                        // Ghép mảng số mới lại thành chuỗi và gán ngược lại vào thẻ area
                        area.setAttribute('coords', newCoords.join(','));
                    });
                }

                // 3. Đảm bảo ảnh đã tải xong hoàn toàn thì mới chạy hàm tính toán
                // (Vì nếu ảnh chưa load xong, naturalWidth sẽ trả về 0)
                if (img.complete) {
                    resizeImageMap();
                } else {
                    img.addEventListener('load', resizeImageMap);
                }
            });
        </script></main>
